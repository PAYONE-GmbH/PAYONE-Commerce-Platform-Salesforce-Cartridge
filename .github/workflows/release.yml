# .github/workflows/release.yml
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm ci

      - name: Package source
        run: |
          zip -r payone-sfcc-cartridge-${{ github.ref_name }}-source.zip \
            cartridges/ \
            metadata/ \
            documentation/ \
            package.json \
            package-lock.json \
            webpack.config.js \
            README.md \
            LICENSE

      - run: npm run build

      - name: Package pre-built
        run: |
          zip -r payone-sfcc-cartridge-${{ github.ref_name }}.zip \
            cartridges/ \
            metadata/ \
            documentation/ \
            README.md \
            LICENSE

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            payone-sfcc-cartridge-${{ github.ref_name }}-source.zip
            payone-sfcc-cartridge-${{ github.ref_name }}.zip